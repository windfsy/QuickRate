<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickRate</title>
</head>
<body>
  <div class="popup">
    <!-- 头部 -->
    <header class="header">
      <div class="header__left">
        <span class="header__icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 6v6l4 2"/>
          </svg>
        </span>
        <span class="header__title" data-i18n="appName">QuickRate</span>
      </div>
      <button id="refreshBtn" class="icon-btn" data-i18n-title="rateRefreshing">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="23 4 23 10 17 10"/>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
      </button>
    </header>

    <!-- 货币选择 -->
    <section class="currency-section">
      <div class="select-group">
        <label class="select-label" data-i18n="from">源货币</label>
        <div class="select-wrapper">
          <select id="sourceCurrency" class="select">
            <option value="USD">USD - 美元</option>
            <option value="EUR">EUR - 欧元</option>
            <option value="GBP">GBP - 英镑</option>
            <option value="JPY">JPY - 日元</option>
            <option value="CNY">CNY - 人民币</option>
            <option value="KRW">KRW - 韩元</option>
            <option value="INR">INR - 印度卢比</option>
            <option value="RUB">RUB - 卢布</option>
            <option value="BRL">BRL - 巴西雷亚尔</option>
            <option value="AUD">AUD - 澳元</option>
            <option value="CAD">CAD - 加元</option>
            <option value="CHF">CHF - 瑞士法郎</option>
          </select>
        </div>
      </div>

      <button id="swapBtn" class="swap-btn" data-i18n-title="swap">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="7 16 3 12 7 8"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <polyline points="17 8 21 12 17 16"/>
        </svg>
      </button>

      <div class="select-group">
        <label class="select-label" data-i18n="to">目标货币</label>
        <div class="select-wrapper">
          <select id="targetCurrency" class="select">
            <option value="CNY">CNY - 人民币</option>
            <option value="USD">USD - 美元</option>
            <option value="EUR">EUR - 欧元</option>
            <option value="GBP">GBP - 英镑</option>
            <option value="JPY">JPY - 日元</option>
            <option value="KRW">KRW - 韩元</option>
            <option value="INR">INR - 印度卢比</option>
            <option value="RUB">RUB - 卢布</option>
            <option value="BRL">BRL - 巴西雷亚尔</option>
            <option value="AUD">AUD - 澳元</option>
            <option value="CAD">CAD - 加元</option>
            <option value="CHF">CHF - 瑞士法郎</option>
          </select>
        </div>
      </div>
    </section>

    <!-- 汇率显示 -->
    <section class="rate-card">
      <div class="rate-card__label" data-i18n="exchangeRate">当前汇率</div>
      <div id="exchangeRate" class="rate-card__value">--</div>
      <div id="rateTime" class="rate-card__time" data-i18n="rateUpdated">刚刚更新</div>
    </section>

    <!-- 开关 -->
    <section class="controls">
      <div class="control-item">
        <span class="control-label" data-i18n="enableConversion">启用转换</span>
        <label class="switch">
          <input type="checkbox" id="enableConversion" checked>
          <span class="switch__track"></span>
        </label>
      </div>
      <div class="control-item">
        <span class="control-label" data-i18n="showOriginal">显示原金额</span>
        <label class="switch">
          <input type="checkbox" id="showOriginal" checked>
          <span class="switch__track"></span>
        </label>
      </div>
    </section>

    <!-- 统计 -->
    <section class="stats">
      <div class="stats__item">
        <span id="convertedCount" class="stats__number">0</span>
        <span class="stats__label" data-i18n="converted">已转换</span>
      </div>
    </section>

    <!-- 底部 -->
    <footer class="footer">
      <span id="status" class="footer__status" data-i18n="ready">就绪</span>
      <a href="#" id="privacyLink" class="footer__link" data-i18n="privacyPolicy">隐私政策</a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
