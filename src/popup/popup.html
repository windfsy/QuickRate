<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickRate</title>
</head>
<body>
  <div class="popup">
    <!-- 头部 -->
    <header class="header">
      <div class="header__left">
        <span class="header__icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 6v6l4 2"/>
          </svg>
        </span>
        <span class="header__title">QuickRate</span>
      </div>
      <button id="refreshBtn" class="icon-btn" title="刷新汇率">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="23 4 23 10 17 10"/>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
      </button>
    </header>

    <!-- 货币选择 -->
    <section class="currency-section">
      <div class="select-group">
        <label class="select-label">From</label>
        <div class="select-wrapper">
          <select id="sourceCurrency" class="select">
            <option value="USD">USD</option>
            <option value="EUR">EUR</option>
            <option value="GBP">GBP</option>
            <option value="JPY">JPY</option>
            <option value="CNY">CNY</option>
            <option value="KRW">KRW</option>
            <option value="INR">INR</option>
            <option value="RUB">RUB</option>
            <option value="BRL">BRL</option>
            <option value="AUD">AUD</option>
            <option value="CAD">CAD</option>
            <option value="CHF">CHF</option>
          </select>
        </div>
      </div>

      <button id="swapBtn" class="swap-btn" title="交换">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="7 16 3 12 7 8"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <polyline points="17 8 21 12 17 16"/>
        </svg>
      </button>

      <div class="select-group">
        <label class="select-label">To</label>
        <div class="select-wrapper">
          <select id="targetCurrency" class="select">
            <option value="CNY">CNY</option>
            <option value="USD">USD</option>
            <option value="EUR">EUR</option>
            <option value="GBP">GBP</option>
            <option value="JPY">JPY</option>
            <option value="KRW">KRW</option>
            <option value="INR">INR</option>
            <option value="RUB">RUB</option>
            <option value="BRL">BRL</option>
            <option value="AUD">AUD</option>
            <option value="CAD">CAD</option>
            <option value="CHF">CHF</option>
          </select>
        </div>
      </div>
    </section>

    <!-- 汇率显示 -->
    <section class="rate-card">
      <div class="rate-card__label">Exchange Rate</div>
      <div id="exchangeRate" class="rate-card__value">--</div>
      <div id="rateTime" class="rate-card__time">Updated just now</div>
    </section>

    <!-- 开关 -->
    <section class="controls">
      <div class="control-item">
        <span class="control-label">Enable conversion</span>
        <label class="switch">
          <input type="checkbox" id="enableConversion" checked>
          <span class="switch__track"></span>
        </label>
      </div>
      <div class="control-item">
        <span class="control-label">Show original</span>
        <label class="switch">
          <input type="checkbox" id="showOriginal" checked>
          <span class="switch__track"></span>
        </label>
      </div>
    </section>

    <!-- 统计 -->
    <section class="stats">
      <div class="stats__item">
        <span id="convertedCount" class="stats__number">0</span>
        <span class="stats__label">converted</span>
      </div>
    </section>

    <!-- 底部 -->
    <footer class="footer">
      <span id="status" class="footer__status">Ready</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
