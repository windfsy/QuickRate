<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#42A5F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E88E5;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 背景圆角方形 -->
  <rect width="128" height="128" rx="24" ry="24" fill="url(#bg)"/>

  <!-- 货币符号 ¥ -->
  <text x="64" y="82" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white" text-anchor="middle">¥</text>

  <!-- 转换箭头 -->
  <path d="M 88 32 L 108 32 L 108 52" stroke="white" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 108 32 L 80 60" stroke="white" stroke-width="8" fill="none" stroke-linecap="round"/>
</svg>